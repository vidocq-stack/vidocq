# Start-time code of Jakarta REST, for the class redefinition of vidocq:dev: code that runs once at start, so that a
# change to it swaps the application layer instead of being redefined in place. Read by vidocq:dev only, never at run
# time. Format: docs, "Declaring start-time code".

# Providers are singletons; the Application subclass is created once, when the application is deployed.
long-lived-annotations = jakarta.ws.rs.ext.Provider
long-lived-types = jakarta.ws.rs.core.Application
# What the runtime reads once from them at deployment.
start-callbacks = jakarta.ws.rs.core.Application#getClasses()Ljava/util/Set;, \
    jakarta.ws.rs.core.Application#getSingletons()Ljava/util/Set;, \
    jakarta.ws.rs.core.Application#getProperties()Ljava/util/Map;, \
    jakarta.ws.rs.core.Feature#configure(Ljakarta/ws/rs/core/FeatureContext;)Z, \
    jakarta.ws.rs.container.DynamicFeature#configure(Ljakarta/ws/rs/container/ResourceInfo;Ljakarta/ws/rs/core/FeatureContext;)V

# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = cassini-rest
description = Jakarta REST (JAX-RS) endpoints
# The APT bundle that goes on the annotationProcessorPaths, with this extension's groupId and version.
codegen = vidocq-runtime-cassini-rest-extension-codegen
# What the application's module-info.java needs besides `requires` of this extension's module.
# Cassini does not re-export Jakarta REST, and its generated sources import @Generated (java.compiler).
module-info.requires.static = java.compiler
module-info.requires = jakarta.cdi, jakarta.inject, jakarta.ws.rs, jakarta.json.bind, io.vidocq.cassini.api
# JAX-RS and JSON-B reflect on the application package.
module-info.opens-application-package = true

# Champollion binds, in the dependency jar that holds them, the types the application's REST resources exchange:
# the application's compilation lists them in META-INF/champollion/dependency-types, and the processor gets their
# names with -Achampollion.jsonb.types. A jar already compiled with Champollion's REST bindings is left as it is.
brick=Champollion
application-classes=META-INF/champollion/dependency-types
application-classes-option=champollion.jsonb.types
markers=META-INF/champollion/rest-bindings
merge=META-INF/services/io.vidocq.champollion.jsonb.spi.JsonbBinding

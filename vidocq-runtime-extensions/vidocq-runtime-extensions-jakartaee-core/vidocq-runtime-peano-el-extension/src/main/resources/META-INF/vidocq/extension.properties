# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = peano-el
description = Jakarta Expression Language 6.0
family = jakarta-ee
# The APT bundle that goes on the annotationProcessorPaths, with this extension's groupId and version.
codegen = vidocq-runtime-peano-el-extension-codegen
# What the application's module-info.java needs besides `requires` of this extension's module.
# The application's EL expressions use the Peano API directly.
module-info.requires = io.vidocq.peano.api

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Vidocq dev console</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="console.css">
<script type="module" src="console.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>Vidocq dev console</h1>
      <span class="url" id="url"></span>
      <span class="version" id="version"></span>
    </div>
    <span class="state" id="state" data-s="connecting" aria-live="polite"><span class="dot"></span><span id="state-text">connecting…</span></span>
    <button id="pause" type="button" aria-pressed="false">Pause</button>
  </header>

  <p class="banner" id="port-banner" role="status" hidden></p>

  <div class="app">
    <nav class="rail" aria-label="Panels">
      <h2>Panels</h2>
      <div class="tabs" role="tablist" id="tabs"></div>
      <p class="rail-note">A panel appears when its extension is on the module path. The console shows the report of
        this boot and samples the live values once a second, reading memory only.</p>
    </nav>

    <main class="panel" id="panel" role="tabpanel">
      <noscript><p class="summary">The dev console draws its panels with JavaScript: enable it for this page.</p></noscript>
    </main>
  </div>
</div>
</body>
</html>

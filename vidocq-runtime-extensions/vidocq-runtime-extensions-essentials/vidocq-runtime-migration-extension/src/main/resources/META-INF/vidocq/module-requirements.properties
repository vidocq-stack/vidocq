# Vidocq module-info requirements for the schema-migration extension.
# Read by `mvn vidocq:check-module-info`: an application that depends on this extension MUST declare
# these JPMS directives in its module-info.java, or migrations break on the module path.

# The migration backend (Flyway/Liquibase) scans the db.migration package for classpath migrations;
# a named module encapsulates its packages, so it must open db.migration unqualified.
opens = db.migration
reason.db.migration = the migration backend (Flyway/Liquibase) scans the db.migration package for classpath migrations

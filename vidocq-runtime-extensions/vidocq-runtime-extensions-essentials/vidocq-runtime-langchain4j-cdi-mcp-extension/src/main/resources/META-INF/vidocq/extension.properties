# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = langchain4j-cdi-mcp
description = langchain4j-cdi MCP server (/mcp)
# The runtime finds this extension as a service: an application never requires its module.
module-info.requires-module = false
# It reads the langchain4j-cdi MCP server instead, whose annotations and types it compiles against.
module-info.requires = dev.langchain4j.cdi.mcp.server
# JSON-B reflects on the application package for tool arguments and results.
module-info.opens-application-package = true

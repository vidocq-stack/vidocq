# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = liquibase-migration
description = Liquibase schema migrations
family = data
# The migrations live in the application's db.migration resource package, which its module opens once it
# holds a file (BUG-20261030-11).
module-info.opens-resource-package = db.migration

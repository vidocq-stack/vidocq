# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = noether-persistence
description = Jakarta Persistence 3.2 (JPA)
family = data
# The APT bundle that goes on the annotationProcessorPaths, with this extension's groupId and version.
codegen = vidocq-runtime-noether-persistence-extension-codegen
# What the application's module-info.java needs besides `requires` of this extension's module: the accessors
# Noether's processor generates for the entities implement its SPI, and the processor asks for this directive.
module-info.requires = io.vidocq.noether.jpa.core
# A unit takes its connections from a Mansart pool, and a JTA unit its transactions from Mansart Transactions.
requires-extensions = mansart-pool, mansart-transactions

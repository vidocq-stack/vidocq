# Start-time code of Vaadin Flow, for the class redefinition of vidocq:dev: code that runs once at start, or once
# for an open page, so that a change to it swaps the application layer instead of being redefined in place. Read by
# vidocq:dev only, never at run time. Format: docs, "Declaring start-time code".

# Objects of these Vaadin CDI scopes outlive a page refresh, and so does a view that preserves itself on refresh: a
# change to their constructors would never show.
long-lived-annotations = com.vaadin.cdi.annotation.UIScoped, \
    com.vaadin.cdi.annotation.NormalUIScoped, \
    com.vaadin.cdi.annotation.VaadinSessionScoped, \
    com.vaadin.cdi.annotation.RouteScoped, \
    com.vaadin.cdi.annotation.NormalRouteScoped, \
    com.vaadin.cdi.annotation.VaadinServiceScoped, \
    com.vaadin.flow.router.PreserveOnRefresh
# Service init listeners are created once, when the Vaadin service starts.
long-lived-types = com.vaadin.flow.server.VaadinServiceInitListener
start-callbacks = com.vaadin.flow.server.VaadinServiceInitListener#serviceInit(Lcom/vaadin/flow/server/ServiceInitEvent;)V

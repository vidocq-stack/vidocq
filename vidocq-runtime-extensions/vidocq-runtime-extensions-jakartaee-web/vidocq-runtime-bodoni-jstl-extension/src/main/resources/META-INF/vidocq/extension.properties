# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = bodoni-jstl
description = Jakarta Standard Tag Library (c:, fmt:, fn:, x:, sql:) for the pages
family = web
# What the application's module-info.java needs besides `requires` of this extension's module.
# vidocq:generate compiles the pages into the application module, which reads Bodoni's tag handlers and
# the Ibarra and Peano APIs itself (vidocq#232).
module-info.requires = io.vidocq.bodoni.core, io.vidocq.ibarra.api, io.vidocq.peano.api

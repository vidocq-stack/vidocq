# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = foy-websocket
description = Jakarta WebSocket 2.2 on Foy, with the allowed origins of the runtime configuration
family = web
# What the application's module-info.java needs besides `requires` of this extension's module: the endpoints
# of the application read the WebSocket API.
module-info.requires = jakarta.websocket

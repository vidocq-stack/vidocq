# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = mansart-pool
description = JDBC connection pooling
family = data
# The dev service (io.vidocq.runtime) that provides it under vidocq dev, vidocq test and mvn test: `vidocq extension add`
# declares it on vidocq-runtime-maven-plugin and, with vidocq-runtime-devservices-junit, in test scope (BUG-20261031-05).
devservice = vidocq-runtime-devservice-postgres
# The JDBC driver that dev service starts on, in runtime scope, unless the project declares a driver already
# (BUG-20261031-06): groupId:artifactId:version, as no Vidocq BOM versions a driver.
devservice.driver = org.postgresql:postgresql:42.7.10
# The block `vidocq extension add` and `vidocq create` append to vidocq.properties, once, line by line in key order;
# {app} is the project's artifactId. Commented: the PostgreSQL dev service sets the three keys itself, as system
# properties, under vidocq dev and the tests (BUG-20261031-12).
config.01 = # The PostgreSQL dev service sets vidocq.pool.url, .username and .password under vidocq dev, vidocq test and
config.02 = # mvn test. Everywhere else (vidocq run, the packaged application), the pool needs them: uncomment them, or
config.03 = # set them with `vidocq config set`, which uncomments the line in place.
config.04 = #vidocq.pool.url=jdbc:postgresql://localhost:5432/{app}
config.05 = #vidocq.pool.username={app}
config.06 = #vidocq.pool.password={app}

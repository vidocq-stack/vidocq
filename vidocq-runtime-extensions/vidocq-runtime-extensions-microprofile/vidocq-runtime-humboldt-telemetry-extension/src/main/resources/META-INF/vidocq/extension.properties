# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = humboldt-telemetry
description = MicroProfile Telemetry (traces, metrics, logs)
family = microprofile
# The dev service (io.vidocq.runtime) that provides it under vidocq dev, vidocq test and mvn test: `vidocq extension add`
# declares it on vidocq-runtime-maven-plugin and, with vidocq-runtime-devservices-junit, in test scope (BUG-20261031-05).
devservice = vidocq-runtime-devservice-otel
# Not in test scope: a test needs no collector, and Grafana LGTM would start with every mvn test.
devservice.in-tests = false
# The block `vidocq extension add` and `vidocq create` append to vidocq.properties, once, line by line in key order;
# {app} is the project's artifactId. A key the application already sets is left out (BUG-20261031-09).
config.01 = # Traces, metrics and logs leave through OTLP. Under vidocq dev, the OpenTelemetry dev service points the
config.02 = # endpoint and the protocol to its own collector; these are the values everywhere else.
config.03 = otel.sdk.disabled=false
config.04 = otel.service.name={app}
config.05 = otel.exporter.otlp.endpoint=http://localhost:4318
config.06 = otel.exporter.otlp.protocol=http/protobuf

# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = cervantes-jwt
description = MicroProfile JWT authentication
family = microprofile
# The APT bundle that goes on the annotationProcessorPaths, with this extension's groupId and version.
codegen = vidocq-runtime-cervantes-jwt-extension-codegen
# The dev service (io.vidocq.runtime) that provides it under vidocq dev, vidocq test and mvn test: `vidocq extension add`
# declares it on vidocq-runtime-maven-plugin and, with vidocq-runtime-devservices-junit, in test scope (BUG-20261031-05).
devservice = vidocq-runtime-devservice-keycloak
# The block `vidocq extension add` and `vidocq create` append to vidocq.properties, once, line by line in key order;
# {app} is the project's artifactId. Only hints: the Keycloak dev service sets the verification keys itself, and a
# realm import naming a file not there yet would stop it (BUG-20261031-09).
config.01 = # The Keycloak dev service sets mp.jwt.verify.issuer and mp.jwt.verify.publickey.location under vidocq dev,
config.02 = # vidocq test and mvn test. For production, point them to your identity provider (vidocq doctor warns until
config.03 = # then, as every token would be rejected):
config.04 = #mp.jwt.verify.issuer=https://keycloak.example.com/realms/{app}
config.05 = #mp.jwt.verify.publickey.location=https://keycloak.example.com/realms/{app}/protocol/openid-connect/certs
config.06 = # A realm of your own for the dev service, with its users and roles: export it from the Keycloak admin
config.07 = # console to this file, then uncomment both lines.
config.08 = #vidocq.dev.keycloak.realm-import=src/main/resources/keycloak/{app}-realm.json
config.09 = #vidocq.dev.keycloak.realm={app}

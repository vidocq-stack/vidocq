# Chappe HTTP listener
vidocq.chappe.listener.default.host=0.0.0.0
vidocq.chappe.listener.default.port=8080

# REST API mounted at /api (Cassini = JAX-RS 4.0 over Chappe)
vidocq.http.mount.api.path=/api
vidocq.http.mount.api.type=restful

# OpenAPI (Grimm) — declare the server base so Swagger UI "Try it out" targets /api/*
# (resources are scanned by their @Path, e.g. /products, but they are served under /api).
mp.openapi.servers=/api

# Static UI served from src/main/resources/static/ — index.html drives the demo.
vidocq.http.mount.ui.path=/
vidocq.http.mount.ui.type=static
vidocq.http.mount.ui.classpath=static
vidocq.http.mount.ui.cache-in-memory=true

# Mansart pool — @Default datasource, H2 in-memory.
# DB_CLOSE_DELAY=-1 keeps the in-mem DB alive for the whole JVM lifetime.
vidocq.pool.url=jdbc:h2:mem:mansart-vidocq-demo;DB_CLOSE_DELAY=-1
vidocq.pool.username=sa
vidocq.pool.maxSize=8
vidocq.pool.acquireTimeout=PT5S
# XA enlistment (MANSART-007): inside a @Transactional method the JTA bridge enlists the H2
# driver's XAResource (real two-phase commit) instead of the single-phase LRCO fallback. The
# XADataSource class is auto-detected from the URL (H2/PostgreSQL); override with
# vidocq.pool.xaDataSourceClass for other drivers.
vidocq.pool.xa=true

# Named datasource "audit" — a DISTINCT H2 in-memory DB. Declared here (properties path) AND via
# @VidocqDataSources on MansartH2ExampleApp (annotation path); the codegen merges + dedups the two
# and generates a @Named("audit") DataSource holder. It is injected with @Inject @Named("audit")
# DataSource (see SchemaInitializer) and targeted by @Repository(dataStore = "audit")
# (see AuditEntryRepository).
vidocq.pool.audit.url=jdbc:h2:mem:mansart-vidocq-audit;DB_CLOSE_DELAY=-1
vidocq.pool.audit.username=sa
vidocq.pool.audit.maxSize=4
vidocq.pool.audit.xa=true

# Durable transaction journal (MANSART-007) — enables the boot-time recovery scan that
# completes or rolls back in-doubt XA branches left by a crash ("recovery scan clean" in the
# boot log). In-memory H2 cannot actually leave in-doubt branches across restarts; this
# demonstrates the wiring.
vidocq.tx.recovery.log=target/tx-recovery.log

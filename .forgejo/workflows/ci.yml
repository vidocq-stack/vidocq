name: CI

# Post-merge flow of the monorepo (push on main): an incremental build. gitflow-incremental-builder builds the modules
# changed since the last deployed commit of main (refs/deployed/main), and every module depending on them, then
# deploys them as SNAPSHOTs. The modules it leaves out keep their SNAPSHOT of an earlier push.
# Tests run unless pr-validate already ran them on this very commit, over this very scope: main only fast-forwards,
# so the pushed commit is the head a green pr-validate built, and when the deployed commit is the one main pointed
# to before the push, both runs compare with the same base. A red earlier deploy, a forced push or a commit that
# no pull request validated run the tests here.
# The whole reactor is built, tested and deployed every night (nightly.yml), and on a push the incremental builder
# cannot compare (no deployed commit yet, a forced push).
# No sources or javadoc jar on a SNAPSHOT (Yann, 2026-11-19): the release builds them.
on:
  push:
    branches: [main]

# One main run at a time, queued, never cancelled: a newer merge must not cut a deploy halfway.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: vidocq-runner
    steps:
      # This job holds the publishing credentials and the signing key: every action it runs is pinned
      # to a commit (workspace CYBER_SECU.md, F-04). Bump the SHAs on purpose, never to a branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, the commit Vidocq/ci pins
        with:
          fetch-depth: 0   # the incremental builder compares with the commit before the push

      - name: Check documented version numbers stay in sync
        run: ./vidocq-runtime/check-doc-versions.sh

      # Compared with refs/deployed/main, the last commit whose SNAPSHOTs a run of this workflow or of nightly.yml
      # deployed: after a green run it is the commit before the push, and after a red one (nothing deployed,
      # deployAtEnd) this run also builds what the failed push changed.
      - name: What to build
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          TOKEN: ${{ secrets.VIDOCQ_BOT_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          # Detached at the pushed commit: gib.disableIfBranchMatches=main is for a developer's local main only.
          git checkout -q --detach
          base=""
          if git fetch -q --no-tags origin +refs/deployed/main:refs/remotes/origin/gib-base 2>/dev/null \
              && git merge-base --is-ancestor refs/remotes/origin/gib-base HEAD; then
            base=$(git rev-parse refs/remotes/origin/gib-base)
            echo "args=-Dgib.referenceBranch=refs/remotes/origin/gib-base -Dgib.compareToMergeBase=false -Dgib.uncommitted=false -Dgib.untracked=false" >> "$GITHUB_OUTPUT"
            echo "Incremental: changes since ${base:0:10}, the last deployed commit"
          else
            echo "args=-Dgib.disable=true" >> "$GITHUB_OUTPUT"
            echo "Full build: no deployed commit of main to compare with"
          fi
          # The tests already ran when pr-validate is green on this commit and the deployed commit is main before
          # the push (see the comment at the top). Any doubt, an unreadable status included, runs them.
          verdict=$(python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(f"{os.environ['API']}/commits/{os.environ['GITHUB_SHA']}/status",
                                       headers={"Authorization": "token " + os.environ["TOKEN"]})
          try:
              statuses = json.load(urllib.request.urlopen(req, timeout=30)).get("statuses") or []
          except Exception as e:
              print("unknown (" + type(e).__name__ + ")")
          else:
              print(next((s["status"] for s in statuses
                          if s.get("context") == "pr-validate / pr-validate (pull_request)"), "none"))
          PY
          )
          if [ -n "$base" ] && [ "$base" = "$BEFORE" ] && [ "$verdict" = "success" ]; then
            echo "skip-tests=true" >> "$GITHUB_OUTPUT"
            echo "Tests skipped: pr-validate is green on ${GITHUB_SHA:0:10}, against the same base"
          else
            echo "skip-tests=false" >> "$GITHUB_OUTPUT"
            echo "Tests run: pr-validate verdict '${verdict}', deployed base ${base:0:10}, main before the push ${BEFORE:0:10}"
          fi

      - name: Fetch Vidocq/ci action (Forgejo mirror, basic-auth)
        shell: bash
        env:
          MIRROR_URL:  ${{ secrets.MIRROR_ASD_URL }}
          MIRROR_USER: ${{ secrets.MIRROR_ASD_USER }}
          MIRROR_PASS: ${{ secrets.MIRROR_ASD_PASSWORD }}
        run: |
          set -euo pipefail
          enc_pass=$(python3 -c "import os,urllib.parse;print(urllib.parse.quote(os.environ['MIRROR_PASS'], safe=''))")
          host="${MIRROR_URL#https://}"; host="${host#http://}"; host="${host%/}"
          ci_sha=f79ddba722c722227e6d5b013d4b94a39c68009b
          git clone --quiet --branch main \
            "https://${MIRROR_USER}:${enc_pass}@${host}/Vidocq/ci.git" \
            .ci-action
          git -C .ci-action checkout --quiet --detach "$ci_sha"
          test "$(git -C .ci-action rev-parse HEAD)" = "$ci_sha"

      - uses: ./.ci-action/setup-maven

      # deployAtEnd (vidocq-parent, the runtime's BOM and parent) holds every upload until every module of the
      # reactor built and passed its tests. Only to maven.vidocq.dev, where CI reads SNAPSHOTs: the copy to
      # central-snapshots is a second pass over the reactor (15 min), made by the nightly build. No git.dirty (a
      # status of the whole tree in every module, 13 min; the checkout is clean) and no jlink image of the examples
      # (the nightly build makes them).
      - name: Build, test & deploy what the push changed
        uses: ./.ci-action/deploy-maven
        with:
          maven-args: -B -ntp -U -Dmaven.source.skip=true -Dmaven.javadoc.skip=true -Dvidocq.build-info.dirty=^none -Dvidocq.jlink.skip=true -P!dist ${{ steps.scope.outputs.args }}
          skip-tests: ${{ steps.scope.outputs.skip-tests }}
          snapshot-also-central: "false"
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-password: ${{ secrets.CENTRAL_PASSWORD }}
          snapshot-username: ${{ secrets.REPOSILITE_USERNAME }}
          snapshot-password: ${{ secrets.REPOSILITE_PASSWORD }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Record the deployed commit
        env:
          TOKEN: ${{ secrets.VIDOCQ_BOT_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git push -q --force "${SERVER/https:\/\//https://oauth2:${TOKEN}@}/${REPOSITORY}.git" "$GITHUB_SHA:refs/deployed/main"
          echo "refs/deployed/main -> ${GITHUB_SHA:0:10}"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.ci-action/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}

      - name: Notify Slack on success
        if: success()
        uses: ./.ci-action/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: success
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          sha: ${{ github.sha }}
          commit-message: ${{ github.event.head_commit.message }}
          commit-author: ${{ github.event.head_commit.author.name }}

name: CI

# Post-merge flow (push on main). Common steps come from the Vidocq/ci composite actions.
on:
  push:
    branches: [main]

# One main run at a time, queued, never cancelled: a newer merge must not cut a deploy halfway
# (Forgejo cancels superseded runs by default; with a group and cancel-in-progress: false it queues them).
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@v4

      - name: Check documented version numbers stay in sync
        run: ./check-doc-versions.sh

      - name: Fetch Vidocq/ci action (Forgejo mirror, basic-auth)
        shell: bash
        env:
          MIRROR_URL:  ${{ secrets.MIRROR_ASD_URL }}
          MIRROR_USER: ${{ secrets.MIRROR_ASD_USER }}
          MIRROR_PASS: ${{ secrets.MIRROR_ASD_PASSWORD }}
        run: |
          set -euo pipefail
          enc_pass=$(python3 -c "import os,urllib.parse;print(urllib.parse.quote(os.environ['MIRROR_PASS'], safe=''))")
          host="${MIRROR_URL#https://}"; host="${host#http://}"; host="${host%/}"
          git clone --depth=1 --branch main \
            "https://${MIRROR_USER}:${enc_pass}@${host}/Vidocq/ci.git" \
            .ci-action

      - uses: ./.ci-action/setup-maven

      # One pass: the deploy builds and tests the reactor itself. Safe because every pom sets
      # deployAtEnd (root, BOM, reactor parent): a failing test stops the build before the
      # deferred upload, so nothing is published. The separate verify built everything twice.
      - name: Build, test & deploy to Maven Central
        uses: ./.ci-action/deploy-maven
        with:
          maven-args: -B -ntp -U
          skip-tests: "false"
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-password: ${{ secrets.CENTRAL_PASSWORD }}
          snapshot-username: ${{ secrets.REPOSILITE_USERNAME }}
          snapshot-password: ${{ secrets.REPOSILITE_PASSWORD }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # The one module that requires jdk.crac (vidocq-runtime-crac-extension) sits in the `crac` profile and builds on a
      # CRaC JDK only, so the pass above leaves it out. Second pass: the same deploy, on Azul Zulu CRaC, for that module
      # alone. Its parents and the runtime it depends on were installed by the first pass, in this job.
      - name: Install Azul Zulu CRaC
        shell: bash
        # The runners are x86_64 and aarch64: the build of the runner's architecture, checked against its pinned
        # SHA-256, a cut download tried again (install-zulu-crac.sh).
        run: |
          set -euo pipefail
          ./install-zulu-crac.sh "$RUNNER_TEMP/zulu"
          echo "CRAC_JAVA_HOME=$RUNNER_TEMP/zulu" >> "$GITHUB_ENV"

      - name: Deploy the CRaC extension (built on a CRaC JDK)
        uses: ./.ci-action/deploy-maven
        env:
          JAVA_HOME: ${{ env.CRAC_JAVA_HOME }}
        with:
          maven-args: -B -ntp -Pcrac -pl vidocq-runtime-extensions/vidocq-runtime-extensions-essentials/vidocq-runtime-crac-extension
          skip-tests: "true"
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-password: ${{ secrets.CENTRAL_PASSWORD }}
          snapshot-username: ${{ secrets.REPOSILITE_USERNAME }}
          snapshot-password: ${{ secrets.REPOSILITE_PASSWORD }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Notify Slack on failure
        if: failure()
        uses: ./.ci-action/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}

      - name: Notify Slack on success
        if: success()
        uses: ./.ci-action/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: success
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          sha: ${{ github.sha }}
          commit-message: ${{ github.event.head_commit.message }}
          commit-author: ${{ github.event.head_commit.author.name }}

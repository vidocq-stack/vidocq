# Pull-request validation of the monorepo (MONOREPO.md §4 and §5, Sunday step 1).
#
#   pr-state           what the pull request is now (ready, WIP, train member), read through the API
#                      (Vidocq/ci pr-validate-gate, mode state).
#   governance-checks  CLA, GPG signature, Signed-off-by. Required context
#                      `pr-validate / governance-checks (pull_request)`.
#   producer           gitflow-incremental-builder (.mvn/extensions.xml, gib.* in the root pom): the modules the
#                      pull request changes, their upstream without tests and every downstream module with its
#                      tests. No TCK: they run once a day, on demand and for a release (tck-nightly.yml);
#                      a pull request that needs one dispatches `TCK nightly` on its branch with its component.
#   impacted           no repository outside depends on a pull request any more: a shared API change fixes every
#                      caller in the same pull request (MONOREPO.md §6). erasmus, tassis, verne and VCU build
#                      against the SNAPSHOTs of main. The job stays because the verdict reads it: no consumer.
#   downstream         skipped, for the same reason.
#   pr-validate        the aggregator (pr-validate-gate, mode verdict). Required context
#                      `pr-validate / pr-validate (pull_request)`.
#
#   title-check        MONOREPO.md §7, a warning only for now: the verdict does not read it.
#
# Not yet here: the reuse of a validated tree.
name: pr-validate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

jobs:
  pr-state:
    runs-on: vidocq-runner
    outputs:
      state: ${{ steps.state.outputs.state }}
      run-producer: ${{ steps.state.outputs.run-producer }}
      run-downstream: ${{ steps.state.outputs.run-downstream }}
    steps:
      - id: state
        uses: https://codefloe.com/Vidocq/ci/pr-validate-gate@main
        with:
          mode: state
          token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

  governance-checks:
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: https://codefloe.com/Vidocq/ci/governance-checks@main
        with:
          pr-author: ${{ github.event.pull_request.user.login }}
          slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  # MONOREPO.md §7: `[WIP] [TAG][TAG] type(scope): subject (#n)`. A warning for now (Yann, 2026-11-19), blocking after
  # a week: this job is not one the verdict reads, and it never fails. The tags come from components.json.
  title-check:
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main || true
          git diff --name-only "$(git merge-base origin/main HEAD)" HEAD > "$RUNNER_TEMP/changed.txt" || true
          python3 - "$RUNNER_TEMP/changed.txt" <<'PY'
          import json, os, re, sys
          title = os.environ["TITLE"]
          doc = json.load(open("components.json"))
          known = {c["tag"]: [c["path"]] for c in doc["components"]}
          known.update({o["tag"]: o["paths"] for o in doc["other_tags"]})
          problems = []
          m = re.match(r"^(\[WIP\] ?)?((?:\[[A-Z0-9-]+\])+) (\S.*)$", title)
          if not m:
              problems.append("the title does not start with [WIP]? then one or more [TAG]: " + title)
              tags = []
          else:
              tags = re.findall(r"\[([A-Z0-9-]+)\]", m.group(2))
              for t in tags:
                  if t not in known:
                      problems.append(f"unknown tag [{t}] (components.json)")
              if not re.match(r"^[a-z]+(\([^)]+\))?!?: \S", m.group(3)):
                  problems.append("no Conventional Commits title after the tags: " + m.group(3))
          changed = [l.strip() for l in open(sys.argv[1]) if l.strip()]
          touched = set()
          for f in changed:
              best = max(((t, p) for t, ps in known.items() for p in ps if f == p or f.startswith(p + "/")),
                         key=lambda tp: len(tp[1]), default=None)
              if best:
                  touched.add(best[0])
          docs_only = changed and all(f.endswith((".md", ".adoc")) or "/docs/" in f for f in changed)
          missing = sorted(touched - set(tags) - ({"DOCS"} if docs_only else set()))
          if missing and not (docs_only and "DOCS" in tags):
              problems.append("components touched but not tagged: " + ", ".join(f"[{t}]" for t in missing))
          for p in problems:
              print("::warning title=PR title::" + p)
          print("Title check: " + ("OK" if not problems else f"{len(problems)} warning(s), not blocking yet"))
          PY

  producer:
    needs: [governance-checks, pr-state]
    if: needs.pr-state.outputs.run-producer == 'true'
    runs-on: vidocq-runner
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
      test-only: ${{ steps.changes.outputs.test-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitflow-incremental-builder compares with the merge base of main

      - name: Fetch main for the incremental build
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Detect a docs-only change set
        id: changes
        uses: https://codefloe.com/Vidocq/ci/docs-only-changes@main
        with:
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

      - name: Check documented version numbers stay in sync
        run: ./vidocq-runtime/check-doc-versions.sh

      - uses: https://codefloe.com/Vidocq/ci/setup-maven@main
        if: steps.changes.outputs.docs-only != 'true'

      - name: Build and test what the pull request changes
        if: steps.changes.outputs.docs-only != 'true'
        # -am: the upstream of a changed module is built from this tree, its tests skipped
        # (gib.skipTestsForUpstreamModules); every downstream module runs its tests (gib.buildDownstream=always).
        run: >-
          mvn -B -ntp -U install -am -Dvidocq.build-info.dirty=^none -Dvidocq.jlink.skip=true -P!dist
          -Dgib.referenceBranch=refs/remotes/origin/main
          -Dgib.skipTestsForUpstreamModules=true
          -Dgib.uncommitted=false -Dgib.untracked=false
          -Dgib.logImpactedTo=${{ runner.temp }}/gib-impacted.txt

  impacted:
    needs: [governance-checks, pr-state]
    if: needs.pr-state.outputs.run-downstream == 'true'
    runs-on: vidocq-runner
    outputs:
      matrix: ${{ steps.none.outputs.matrix }}
      count: ${{ steps.none.outputs.count }}
      upstreams: ${{ steps.none.outputs.upstreams }}
    steps:
      - id: none
        run: |
          echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          echo 'count=0' >> "$GITHUB_OUTPUT"
          echo 'upstreams={}' >> "$GITHUB_OUTPUT"

  downstream:
    needs: [pr-state, producer, impacted]
    if: needs.impacted.outputs.count != '0' && needs.impacted.outputs.count != ''
    runs-on: vidocq-runner
    steps:
      - run: echo "No downstream repository is built for a monorepo pull request." && exit 1

  pr-validate:
    needs: [governance-checks, pr-state, producer, impacted, downstream]
    if: always()
    runs-on: vidocq-runner
    steps:
      - name: Verdict
        id: gate
        uses: https://codefloe.com/Vidocq/ci/pr-validate-gate@main
        with:
          mode: verdict
          needs: ${{ toJSON(needs) }}
          token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

      - name: Notify Slack on PR success
        if: success() && steps.gate.outputs.notify == 'true'
        uses: https://codefloe.com/Vidocq/ci/notify-slack@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: pr-validated
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-url: ${{ github.event.pull_request.html_url }}

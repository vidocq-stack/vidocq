name: Nightly build

# The whole reactor built, tested and deployed as SNAPSHOTs once a night (01:00 UTC), whatever the pushes of the day
# built incrementally (ci.yml), with JaCoCo, then the SonarQube analysis of main from that same build, then the
# CRaC extension, which needs a CRaC JDK, then the images of the runtime examples and their Trivy scan. The nightly TCK
# (tck-nightly.yml, 03:00 UTC) follows. No sources or javadoc jar: the release builds them. Unlike a push build, it runs
# Error Prone for the SonarQube analysis, makes the jlink and Docker images of the examples and copies the SNAPSHOTs to
# central-snapshots. A maintainer can run it by hand (workflow_dispatch), on main, or on a maintenance branch
# (maintenance/x.y) before a patch release: there the whole reactor is built and tested and nothing is deployed, analysed
# or installed (a jar of the line's version built from the branch must not stand for the released one).
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # release-gate.py requires a successful run of this workflow on the commit a patch release publishes.
  build-maintenance:
    if: startsWith(github.ref, 'refs/heads/maintenance/')
    runs-on: vidocq-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, the commit Vidocq/ci pins

      - name: Fetch Vidocq/ci action (Forgejo mirror, basic-auth)
        shell: bash
        env:
          MIRROR_URL:  ${{ secrets.MIRROR_ASD_URL }}
          MIRROR_USER: ${{ secrets.MIRROR_ASD_USER }}
          MIRROR_PASS: ${{ secrets.MIRROR_ASD_PASSWORD }}
        run: |
          set -euo pipefail
          enc_pass=$(python3 -c "import os,urllib.parse;print(urllib.parse.quote(os.environ['MIRROR_PASS'], safe=''))")
          host="${MIRROR_URL#https://}"; host="${host#http://}"; host="${host%/}"
          ci_sha=6f4659e3811fb1e8b1dab63ecb9193ac97b105ed
          git clone --quiet --branch main \
            "https://${MIRROR_USER}:${enc_pass}@${host}/Vidocq/ci.git" \
            .ci-action
          git -C .ci-action checkout --quiet --detach "$ci_sha"
          test "$(git -C .ci-action rev-parse HEAD)" = "$ci_sha"

      - uses: ./.ci-action/setup-maven

      - name: Build and test the whole reactor
        run: ./mvnw -B -ntp -Dgib.disable=true -Dvidocq.build-info.dirty=^none verify

      - name: Notify Slack on failure
        if: failure()
        uses: ./.ci-action/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}

  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: vidocq-runner
    steps:
      # Publishing credentials and the signing key: actions pinned to a commit (workspace CYBER_SECU.md, F-04).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, the commit Vidocq/ci pins
        with:
          fetch-depth: 0   # whole history: SonarQube's new-code detection and blame

      - name: Fetch Vidocq/ci action (Forgejo mirror, basic-auth)
        shell: bash
        env:
          MIRROR_URL:  ${{ secrets.MIRROR_ASD_URL }}
          MIRROR_USER: ${{ secrets.MIRROR_ASD_USER }}
          MIRROR_PASS: ${{ secrets.MIRROR_ASD_PASSWORD }}
        run: |
          set -euo pipefail
          enc_pass=$(python3 -c "import os,urllib.parse;print(urllib.parse.quote(os.environ['MIRROR_PASS'], safe=''))")
          host="${MIRROR_URL#https://}"; host="${host#http://}"; host="${host%/}"
          ci_sha=6f4659e3811fb1e8b1dab63ecb9193ac97b105ed
          git clone --quiet --branch main \
            "https://${MIRROR_USER}:${enc_pass}@${host}/Vidocq/ci.git" \
            .ci-action
          git -C .ci-action checkout --quiet --detach "$ci_sha"
          test "$(git -C .ci-action rev-parse HEAD)" = "$ci_sha"

      - uses: ./.ci-action/setup-maven

      - name: Build, test & deploy the whole reactor
        id: deploy
        uses: ./.ci-action/deploy-maven
        with:
          # -Pquality: the JaCoCo reports of the SonarQube analysis below, which reads this build's target/.
          maven-args: -B -ntp -U -Pquality -Dgib.disable=true -Dmaven.source.skip=true -Dmaven.javadoc.skip=true -Dvidocq.build-info.dirty=^none
          skip-tests: "false"
          snapshot-also-central: "true"
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-password: ${{ secrets.CENTRAL_PASSWORD }}
          snapshot-username: ${{ secrets.REPOSILITE_USERNAME }}
          snapshot-password: ${{ secrets.REPOSILITE_PASSWORD }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # The next push to main compares with this commit (ci.yml). A nightly run older than the last push run only
      # widens the next incremental build.
      - name: Record the deployed commit
        env:
          TOKEN: ${{ secrets.VIDOCQ_BOT_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git push -q --force "${SERVER/https:\/\//https://oauth2:${TOKEN}@}/${REPOSITORY}.git" "$GITHUB_SHA:refs/deployed/main"
          echo "refs/deployed/main -> ${GITHUB_SHA:0:10}"

      # Error Prone (#269) reports through the build log of the analysis below, which reads its warnings as external
      # issues: the sources are compiled again there, with the errorprone profile of vidocq-parent. Touched, the main
      # sources are newer than their classes, and maven-compiler-plugin recompiles each module whole, its tests with
      # it. Not in pull requests: a pull request's gate would turn red on findings in code it does not touch.
      - name: Make the main sources stale, for Error Prone
        run: find . -path '*/src/main/java/*' -name '*.java' -not -path '*/target/*' -exec touch {} +

      # The SonarQube analysis of main, the reference of new code for the next day's pull requests, from the build
      # above: no tests run again. Blocking here means a red nightly when the gate of main fails.
      - name: SonarQube analysis of main
        uses: ./.ci-action/sonar-analysis
        with:
          project-key: the-vidocq-project
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          host-url: ${{ vars.SONAR_HOST_URL }}
          bot-token: ${{ secrets.VIDOCQ_BOT_TOKEN }}
          # Compiled again with Error Prone, packaged without tests (a module copies the jar of another before its own
          # package phase), deployed and installed by nobody: Error Prone's warnings, and the SBOM the dependency scan
          # reads, of the modules that ship (root pom). The JaCoCo and test reports of the build above stay in target/.
          maven-args: -B -ntp -Pquality,errorprone -Dgib.disable=true -Dvidocq.build-info.dirty=^none -Dvidocq.aggregator.deploy.skip=false -DskipTests -Dmaven.source.skip=true -Dmaven.javadoc.skip=true -Dvidocq.jlink.skip=true package
          analysis-args: -B -ntp -Pquality,errorprone -Dgib.disable=true -Dvidocq.build-info.dirty=^none -Dsonar.scanner.skipJreProvisioning=true
          blocking: 'true'
          targeted-tests: false
          # INFO until the cleanup of #832: Error Prone's findings show in SonarQube without failing the gate.
          errorprone-severity: INFO

      # vidocq-runtime-crac-extension requires jdk.crac: its own artifact, in the `crac` profile, built on Azul Zulu
      # CRaC against the runtime the step above installed. Also built by the release.
      - name: Install Azul Zulu CRaC
        shell: bash
        run: |
          set -euo pipefail
          ./vidocq-runtime/install-zulu-crac.sh "$RUNNER_TEMP/zulu"
          echo "CRAC_JAVA_HOME=$RUNNER_TEMP/zulu" >> "$GITHUB_ENV"

      - name: Deploy the CRaC extension (built on a CRaC JDK)
        uses: ./.ci-action/deploy-maven
        env:
          JAVA_HOME: ${{ env.CRAC_JAVA_HOME }}
        with:
          maven-args: -B -ntp -Dgib.disable=true -Dmaven.source.skip=true -Dmaven.javadoc.skip=true -Dvidocq.build-info.dirty=^none -Pcrac -pl vidocq-runtime/vidocq-runtime-extensions/vidocq-runtime-extensions-essentials/vidocq-runtime-crac-extension
          skip-tests: "true"
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-password: ${{ secrets.CENTRAL_PASSWORD }}
          snapshot-username: ${{ secrets.REPOSILITE_USERNAME }}
          snapshot-password: ${{ secrets.REPOSILITE_PASSWORD }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Trivy over the jlink and Docker images of the runtime examples (#269), from the SNAPSHOTs the deploy above
      # installed: the examples with a dist profile, as build-images.sh lists them. Report mode, like the scans of the
      # SonarQube analysis: the table goes to the job summary, a HIGH or CRITICAL finding and a scan that could not run
      # to the warnings, and neither turns the nightly red, which a release requires (release-gate.py).
      - name: Build the images of the runtime examples
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          EXAMPLES: vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-cassini-rest-example,vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-cyrano-rest-client-example,vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-cervantes-jwt-example,vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-knock-health-example,vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-petstore-example,vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-noether-persistence-example
        run: mvn -B -ntp -Pdist -Dgib.disable=true -DskipTests -Dvidocq.build-info.dirty=^none package -pl "$EXAMPLES"

      - name: Scan the images of the runtime examples (Trivy)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          EXAMPLES: vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-cassini-rest-example,vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-cyrano-rest-client-example,vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-cervantes-jwt-example,vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-knock-health-example,vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-petstore-example,vidocq-runtime/vidocq-runtime-examples/vidocq-runtime-noether-persistence-example
        run: python3 -I -B .forgejo/scripts/scan-images.py ${EXAMPLES//,/ }

      - name: Notify Slack on failure
        if: failure()
        uses: ./.ci-action/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}

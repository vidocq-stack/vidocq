vidocq.chappe.listener.default.host=0.0.0.0
vidocq.chappe.listener.default.port=8080

# UI statique servie depuis le classpath (src/main/resources/static/).
# Defauts : .index=index.html, .priority=longueur du préfixe normalisé (ici 0).
vidocq.http.mount.ui.path=/
vidocq.http.mount.ui.type=static
# le chemin dans le classpath
vidocq.http.mount.ui.classpath=static
vidocq.http.mount.ui.cache-in-memory=true

# API REST exposée par Cassini (Jakarta RESTful Web Services 4.0).
# Defaut : .priority=longueur du préfixe normalisé (ici 4 — > 0 donc gagne contre /).
vidocq.http.mount.api.path=/api
vidocq.http.mount.api.type=restful

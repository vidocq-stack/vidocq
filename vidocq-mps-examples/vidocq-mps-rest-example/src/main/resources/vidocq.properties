vidocq.chappe.listener.default.host=0.0.0.0
vidocq.chappe.listener.default.port=8080

# UI statique servie depuis le classpath (src/main/resources/static/).
vidocq.mount.ui.path=/
vidocq.mount.ui.type=static
vidocq.mount.ui.classpath=static
vidocq.mount.ui.cache-in-memory=true

# API REST exposée par Cassini (JAX-RS 4.0). Préfixe plus long que /
# → priorité supérieure pour gagner le match de routage.
vidocq.mount.api.path=/api
vidocq.mount.api.type=cassini
vidocq.mount.api.priority=100

# Start-time code of CDI and of the Vidocq runtime, for the class redefinition of vidocq:dev: code that runs once at
# start, so that a change to it swaps the application layer instead of being redefined in place. Read by vidocq:dev
# only, never at run time. Format: docs, "Declaring start-time code".

# Beans of these scopes live as long as the application or the session: their constructors, field initializers and
# initializer methods ran once.
long-lived-annotations = jakarta.enterprise.context.ApplicationScoped, \
    jakarta.enterprise.context.SessionScoped, \
    jakarta.inject.Singleton
# Extensions are created once, at start.
long-lived-types = io.vidocq.runtime.spi.VidocqExtension
# Initializer methods; producer methods.
start-annotations = jakarta.annotation.PostConstruct, \
    jakarta.enterprise.inject.Produces
# Observers of the start events.
observer-annotations = jakarta.enterprise.event.Observes, \
    jakarta.enterprise.event.ObservesAsync
start-events = jakarta.enterprise.event.Startup, \
    jakarta.enterprise.context.Initialized

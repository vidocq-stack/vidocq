# The @Default pool the pool extension requires: a database distinct from "audit", so a row written through
# the wrong pool lands where the test does not count it.
vidocq.pool.url=jdbc:h2:mem:vidocq-it-naming-default;DB_CLOSE_DELAY=-1
vidocq.pool.username=sa
vidocq.pool.maxSize=2

# The "audit" pool, its @Named("audit") DataSource holder named java:comp/env/jdbc/audit below.
vidocq.pool.audit.url=jdbc:h2:mem:vidocq-it-naming-audit;DB_CLOSE_DELAY=-1
vidocq.pool.audit.username=sa
vidocq.pool.audit.maxSize=2

# The java: names: the audit pool, and an alias of it in the application namespace.
vidocq.naming.comp/env/jdbc/audit = javax.sql.DataSource @Named("audit")
vidocq.naming.app/env/jdbc/reporting = java:comp/env/jdbc/audit

# The default pool, shared by the unit `workbench` and the repository Items. DATABASE_TO_LOWER: H2 folds an unquoted
# name to lower case, as PostgreSQL does, which the lower case names of Item need (its Javadoc says why).
vidocq.pool.url=jdbc:h2:mem:vidocq-it-noether-data;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
vidocq.pool.username=sa
vidocq.pool.maxSize=4

# The pool `audit`, another database: the data store of the repository AuditItems. TwoPhaseCommitPostgresModulePathTest
# gives both pools on PostgreSQL, XA, through system properties.
vidocq.pool.audit.url=jdbc:h2:mem:vidocq-it-noether-audit;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
vidocq.pool.audit.username=sa
vidocq.pool.audit.maxSize=4

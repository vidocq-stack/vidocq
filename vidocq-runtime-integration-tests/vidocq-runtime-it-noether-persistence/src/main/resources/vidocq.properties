# The default pool: the JTA unit `ledger` names no jta-data-source, so it takes this one.
vidocq.pool.url=jdbc:h2:mem:vidocq-it-noether;DB_CLOSE_DELAY=-1
vidocq.pool.username=sa
vidocq.pool.maxSize=4

# The named pool `archive`, which the unit `archive` names in its jta-data-source: a database distinct from the
# default one, so a table created through the wrong pool shows. Its @Named("archive") DataSource is generated at
# build time from this key, by vidocq-runtime-mansart-pool-datasources-codegen.
vidocq.pool.archive.url=jdbc:h2:mem:vidocq-it-noether-archive;DB_CLOSE_DELAY=-1
vidocq.pool.archive.username=sa
vidocq.pool.archive.maxSize=2

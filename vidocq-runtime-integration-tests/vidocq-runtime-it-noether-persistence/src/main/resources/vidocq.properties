# The default pool: the JTA unit `ledger` names no jta-data-source, so it takes this one.
vidocq.pool.url=jdbc:h2:mem:vidocq-it-noether;DB_CLOSE_DELAY=-1
vidocq.pool.username=sa
vidocq.pool.maxSize=4

# The named pool `notes`, which the unit `archive` names in its jta-data-source: a database distinct from the
# default one, so a table created through the wrong pool shows. Its @Named("notes") DataSource is generated at
# build time from this key, by vidocq-runtime-mansart-pool-datasources-codegen.
vidocq.pool.notes.url=jdbc:h2:mem:vidocq-it-noether-notes;DB_CLOSE_DELAY=-1
vidocq.pool.notes.username=sa
vidocq.pool.notes.maxSize=2

# A unit no persistence.xml declares (Vidocq/vidocq#551): the keys list its entity, and it is JTA on the default
# pool, as a unit the keys declare is by default. Listing the class keeps Entry and Note out of it.
vidocq.persistence.journal.classes=io.vidocq.runtime.it.noether.Memo
vidocq.persistence.journal.properties.jakarta.persistence.schema-generation.database.action=drop-and-create
# A property of the unit `ledger`, which the persistence.xml declares: a property alone overrides that unit.
vidocq.persistence.ledger.properties.io.vidocq.it.overridden=by-the-keys

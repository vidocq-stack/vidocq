# Some TCK clients read raw sockets without SO_TIMEOUT and hang when the server never answers; a
# global timeout turns those hangs into reported errors (same safety net as foy-tck). SEPARATE_THREAD:
# a thread stuck in Socket.read() ignores interruption, so the watchdog must abandon it.
junit.jupiter.execution.timeout.default = 120 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD

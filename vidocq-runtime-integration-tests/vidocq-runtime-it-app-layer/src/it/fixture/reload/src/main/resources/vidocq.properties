# Port 0: each boot binds a free port, which AppLayerReloadLeakIT reads from Chappe's start line.
vidocq.chappe.listener.default.host=127.0.0.1
vidocq.chappe.listener.default.port=0

vidocq.http.mount.api.path=/api
vidocq.http.mount.api.type=restful

# A static mount on the class path: Chappe looks its files up through the loader of the application layer.
vidocq.http.mount.ui.path=/
vidocq.http.mount.ui.type=static
vidocq.http.mount.ui.classpath=static

greeting.salutation=Hello

# DevServicesRunGoalIT overwrites the shared target/vidocq-dev-services.json with its own `vidocq:run`
# host's run, so DevServicesTestHostIT (whose in-JVM boot reads that file through the JUnit host's
# already-running session) must finish first. @Order on both IT classes below is honoured only when the
# engine orders top-level classes by annotation.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation

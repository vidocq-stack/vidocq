# DevServicesRunGoalIT and DevServicesDevGoalIT each write target/vidocq-dev-services.json, the file of
# the application's hosts, and read it back: they run one after the other, in @Order. DevServicesTestHostIT
# reads the JUnit host's own target/vidocq-dev-services-test.json (BUG-20261106-03), so it no longer has to
# run first; it still does, to keep the module's run the same every time. @Order on the IT classes is
# honoured only when the engine orders top-level classes by annotation.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation

# 1. -pl leaves the root out, so alpha is the top-level project of the build. Its vidocq.idea.exclude leaves alpha
#    out and nothing else; beta's vidocq.idea.skip, declared in beta's own pom, neither skips the goal nor beta.
invoker.goals.1 = vidocq:idea -pl alpha -pl beta
# 2. The check from the root agrees.
invoker.goals.2 = vidocq:idea -Dvidocq.idea.check=true
# 3. With beta as the top-level project, Maven reads vidocq.idea.skip from beta's properties: the goal is skipped,
#    and says so.
invoker.goals.3 = vidocq:idea -pl beta
# 4. The same switch from the command line.
invoker.goals.4 = vidocq:idea -Dvidocq.idea.skip=true

name: official-tags-tck-smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  official-tags-tck-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://codefloe.com/Vidocq/ci/setup-maven@main
      - name: Build Bodoni, run the runner tests and the official Tags smoke tests
        run: ./run-official-tck-tags-3.0.sh smoke

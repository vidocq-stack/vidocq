# Port 0: each start binds a free port, which AppLayerDeliveryIT reads from Chappe's start line.
vidocq.chappe.listener.default.host=127.0.0.1
vidocq.chappe.listener.default.port=0

vidocq.http.mount.api.path=/api
vidocq.http.mount.api.type=restful

# The detailed report has the cdi extensions row, which says what the start did with the record of the build; and a
# start that would run an extension fails.
vidocq.startup.report=detailed
vidocq.startup.require-frozen-extensions=true

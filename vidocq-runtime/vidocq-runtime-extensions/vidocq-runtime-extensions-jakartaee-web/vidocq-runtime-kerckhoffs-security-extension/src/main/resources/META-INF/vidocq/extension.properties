# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = security-kerckhoffs
# The id up to 0.4.0, which still names it (Vidocq/vidocq#809).
former-ids = kerckhoffs-security
description = Jakarta Security 4.0 (authentication mechanisms, identity stores, security context)
family = jakarta-ee
# The APT bundle that goes on the annotationProcessorPaths, with this extension's groupId and version.
codegen = vidocq-runtime-kerckhoffs-security-extension-codegen
# The mechanisms authenticate the requests Foy serves.
requires-extensions = servlet-foy

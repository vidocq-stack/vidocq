# Start-time code of Jakarta Servlet, for the class redefinition of vidocq:dev: code that runs once at start, so that
# a change to it swaps the application layer instead of being redefined in place. Read by vidocq:dev only, never at
# run time. Format: docs, "Declaring start-time code".

# Servlets, filters, listeners and initializers are created once, when the application is deployed.
long-lived-types = jakarta.servlet.Servlet, \
    jakarta.servlet.Filter, \
    jakarta.servlet.ServletContextListener, \
    jakarta.servlet.http.HttpSessionListener, \
    jakarta.servlet.ServletRequestListener, \
    jakarta.servlet.ServletContainerInitializer
# Their start callbacks.
start-callbacks = jakarta.servlet.Servlet#init(Ljakarta/servlet/ServletConfig;)V, \
    jakarta.servlet.GenericServlet#init()V, \
    jakarta.servlet.Filter#init(Ljakarta/servlet/FilterConfig;)V, \
    jakarta.servlet.ServletContextListener#contextInitialized(Ljakarta/servlet/ServletContextEvent;)V, \
    jakarta.servlet.ServletContainerInitializer#onStartup(Ljava/util/Set;Ljakarta/servlet/ServletContext;)V

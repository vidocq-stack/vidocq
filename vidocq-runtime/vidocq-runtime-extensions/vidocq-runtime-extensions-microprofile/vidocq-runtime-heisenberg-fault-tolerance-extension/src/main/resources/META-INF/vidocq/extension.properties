# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = fault-tolerance-heisenberg
# The id up to 0.4.0, which still names it (Vidocq/vidocq#809).
former-ids = heisenberg-fault-tolerance
description = MicroProfile Fault Tolerance
family = microprofile
# Reads its keys through MicroProfile Config: `vidocq extension add` declares the Config extension with it (#829).
requires-extensions = config-ravel
# The APT bundle that goes on the annotationProcessorPaths, with this extension's groupId and version.
codegen = vidocq-runtime-heisenberg-fault-tolerance-extension-codegen

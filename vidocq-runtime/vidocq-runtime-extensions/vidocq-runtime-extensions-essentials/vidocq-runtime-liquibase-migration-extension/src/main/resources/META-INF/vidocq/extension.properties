# Vidocq extension descriptor (vidocq#314): the Vidocq CLI builds its extension catalog from it,
# so `vidocq extension add` / `vidocq create` wire this extension the way it says.
id = migration-liquibase
# The id up to 0.4.0, which still names it (Vidocq/vidocq#809).
former-ids = liquibase-migration
description = Liquibase schema migrations
family = data
# The changelog lives in the application's db.changelog resource package (db/changelog/db.changelog-master.xml
# by default), which its module opens once it holds a file (BUG-20261030-11, BUG-20261115-06).
module-info.opens-resource-package = db.changelog

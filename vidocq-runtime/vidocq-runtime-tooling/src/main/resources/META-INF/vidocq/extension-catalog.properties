pool-mansart.config.01 = # The PostgreSQL dev service sets vidocq.pool.url, .username and .password under vidocq dev, vidocq test and
pool-mansart.config.02 = # mvn test. Everywhere else (vidocq run, the packaged application), the pool needs them: uncomment them, or
pool-mansart.config.03 = # set them with `vidocq config set`, which uncomments the line in place.
pool-mansart.config.04 = #vidocq.pool.url=jdbc:postgresql://localhost:5432/{app}
pool-mansart.config.05 = #vidocq.pool.username={app}
pool-mansart.config.06 = #vidocq.pool.password={app}
pool-mansart.description = JDBC connection pooling
pool-mansart.devservice = vidocq-runtime-devservice-postgres
pool-mansart.devservice.driver = org.postgresql:postgresql:42.7.10
pool-mansart.family = data
pool-mansart.former-ids = mansart-pool


telemetry-humboldt.groupId = io.vidocq.runtime.extensions.microprofile
telemetry-humboldt.artifactId = vidocq-runtime-humboldt-telemetry-extension
telemetry-humboldt.module = io.vidocq.runtime.extensions.microprofile.humboldt
telemetry-humboldt.codegen = vidocq-runtime-humboldt-telemetry-extension-codegen
telemetry-humboldt.config.01 = # Traces, metrics and logs leave through OTLP. Under vidocq dev, the OpenTelemetry dev service points the
telemetry-humboldt.config.02 = # endpoint and the protocol to its own collector; these are the values everywhere else.
telemetry-humboldt.config.03 = otel.sdk.disabled=false
telemetry-humboldt.config.04 = otel.service.name={app}
telemetry-humboldt.config.05 = otel.exporter.otlp.endpoint=http://localhost:4318
telemetry-humboldt.config.06 = otel.exporter.otlp.protocol=http/protobuf
telemetry-humboldt.description = MicroProfile Telemetry (traces, metrics, logs)
telemetry-humboldt.devservice = vidocq-runtime-devservice-otel
telemetry-humboldt.devservice.in-tests = false
telemetry-humboldt.family = microprofile
telemetry-humboldt.former-ids = humboldt-telemetry


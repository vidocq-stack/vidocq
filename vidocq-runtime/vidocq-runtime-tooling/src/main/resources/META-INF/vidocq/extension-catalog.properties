jwt-cervantes.groupId = io.vidocq.runtime.extensions.microprofile
jwt-cervantes.artifactId = vidocq-runtime-cervantes-jwt-extension
jwt-cervantes.module = io.vidocq.runtime.extensions.microprofile.cervantes
jwt-cervantes.codegen = vidocq-runtime-cervantes-jwt-extension-codegen
jwt-cervantes.config.01 = # The Keycloak dev service sets mp.jwt.verify.issuer and mp.jwt.verify.publickey.location under vidocq dev,
jwt-cervantes.config.02 = # vidocq test and mvn test. For production, point them to your identity provider (vidocq doctor warns until
jwt-cervantes.config.03 = # then, as every token would be rejected):
jwt-cervantes.config.04 = #mp.jwt.verify.issuer=https://keycloak.example.com/realms/{app}
jwt-cervantes.config.05 = #mp.jwt.verify.publickey.location=https://keycloak.example.com/realms/{app}/protocol/openid-connect/certs
jwt-cervantes.config.06 = # A realm of your own for the dev service, with its users and roles: export it from the Keycloak admin
jwt-cervantes.config.07 = # console to this file, then uncomment both lines.
jwt-cervantes.config.08 = #vidocq.dev.keycloak.realm-import=src/main/resources/keycloak/{app}-realm.json
jwt-cervantes.config.09 = #vidocq.dev.keycloak.realm={app}
jwt-cervantes.description = MicroProfile JWT authentication
jwt-cervantes.devservice = vidocq-runtime-devservice-keycloak
jwt-cervantes.family = microprofile
jwt-cervantes.former-ids = cervantes-jwt

